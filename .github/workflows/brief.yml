name: overnight-brief

on:
  schedule:
    # 22:17 UTC = 北京 06:17，每天。
    #
    # 为什么不设在 08:00：整点是全球 cron 最拥挤的时刻，2026-08-20 那次实测
    # 排队 85 分钟（00:00 UTC 的任务 01:25 才发车，落地已是北京 09:25）。
    # 改到 06:17 这种冷门分钟，正常 5-20 分钟内跑完，即使再遇到 85 分钟延迟
    # 也能在 07:45 前出页面——你 8 点打开一定是新的。
    #
    # 06:17 也已在美股收盘（北京 04:00-05:00）之后，数据是全的。
    # 周六周日跑出来的是周五那一场（美股不开盘），但隔夜新闻窗口是新的。
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: normal
        options: [normal, no-llm, quotes-only]

# 上一轮没跑完就别开新的，否则两个 job 会同时改 archive 打架
concurrency:
  group: overnight-brief
  cancel-in-progress: false

permissions:
  contents: write        # 要把 archive/ 和 index.html 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 出早报
        env:
          # backend=rules 时两个都不用配，secret 不存在就是空串，不会报错
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ inputs.mode }}" in
            no-llm)      python run.py --no-llm ;;
            quotes-only) python run.py --quotes-only ;;
            *)           python run.py ;;
          esac

      - name: 提交产物
        run: |
          git config user.name  "overnight-brief[bot]"
          git config user.email "overnight-brief@users.noreply.github.com"
          git add archive index.html
          git diff --staged --quiet && { echo "无变化"; exit 0; }
          git commit -m "brief: $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::回写失败，页面这轮不会更新"
