name: overnight-brief

on:
  schedule:
    # 00:00 UTC = 北京 08:00，每天。
    # 注意 GitHub 的 cron 常有 5-20 分钟排队延迟，实际落地多在 08:05-08:20。
    # 周六周日跑出来的是周五那一场（美股不开盘），但隔夜新闻窗口是新的。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: normal
        options: [normal, no-llm, quotes-only]

# 上一轮没跑完就别开新的，否则两个 job 会同时改 archive 打架
concurrency:
  group: overnight-brief
  cancel-in-progress: false

permissions:
  contents: write        # 要把 archive/ 和 index.html 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 出早报
        env:
          # backend=rules 时两个都不用配，secret 不存在就是空串，不会报错
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ inputs.mode }}" in
            no-llm)      python run.py --no-llm ;;
            quotes-only) python run.py --quotes-only ;;
            *)           python run.py ;;
          esac

      - name: 提交产物
        run: |
          git config user.name  "overnight-brief[bot]"
          git config user.email "overnight-brief@users.noreply.github.com"
          git add archive index.html
          git diff --staged --quiet && { echo "无变化"; exit 0; }
          git commit -m "brief: $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::回写失败，页面这轮不会更新"
