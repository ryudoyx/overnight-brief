# ---------------------------------------------------------------- 商品
# unit_to 是落库口径，raw_unit 是 Yahoo 实际返回的口径，换算因子写死在 quotes.py 里，
# 因为 HG=F 返回的是 USD/lb 而不是常见的美分/磅，靠猜必错。
commodities:
  - {sym: "GC=F", name: "COMEX 黄金", raw_unit: "USD/oz",    unit_to: "USD/oz"}
  - {sym: "SI=F", name: "COMEX 白银", raw_unit: "USD/oz",    unit_to: "USD/oz"}
  - {sym: "HG=F", name: "COMEX 铜",   raw_unit: "USD/lb",    unit_to: "USD/t"}
  - {sym: "CL=F", name: "WTI 原油",   raw_unit: "USD/bbl",   unit_to: "USD/bbl"}
  - {sym: "BZ=F", name: "布伦特原油", raw_unit: "USD/bbl",   unit_to: "USD/bbl"}
  - {sym: "NG=F", name: "天然气",     raw_unit: "USD/MMBtu", unit_to: "USD/MMBtu"}

# ---------------------------------------------------------------- 铜专栏
copper:
  miners: ["FCX", "SCCO", "TECK", "ERO", "HBM"]
  shfe_symbol: "CU0"     # 新浪连续合约代码，用于取沪铜夜盘

# ================================================================ 新闻
news:
  # 隔夜窗：北京时间前一日 16:00 起，到脚本运行时刻为止。
  # 用绝对时刻而不是「往回 N 小时」，这样手动补跑一次也不会把窗口错开。
  window_start_hour: 16
  max_llm_items: 120       # 单桶最多送多少条进 Claude
  max_per_source: 25       # 单个源最多贡献多少条——防止某一组 Google News 查询把别的源挤掉
  max_per_category: 2      # 最终版面里单个分类最多几条——同一件事换四种措辞时靠这个保多样性
  llm_batch_size: 25
  fuzzy_dedup_threshold: 0.86

  sources:
    # ---------------- 宏观 / 美股 ----------------
    - {name: 美联储官网,   type: rss,   lang: en, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
    # 彭博和 FT 的 RSS 还活着，而且摘要有 180-400 字（Google News 的摘要基本等于标题）。
    # 路透的公共 RSS 已关停且反爬，只能继续走下面 GN-华尔街 的 site:reuters.com。
    # WSJ 的 feed 看着能打开、有 20 条，但全部冻结在 2025-01-27，是死源，别加。
    - {name: 彭博-Markets,  type: rss, lang: en, url: "https://feeds.bloomberg.com/markets/news.rss"}
    - {name: 彭博-Economics, type: rss, lang: en, url: "https://feeds.bloomberg.com/economics/news.rss"}
    - {name: FT,           type: rss, lang: en, url: "https://www.ft.com/rss/home"}
    - {name: 财联社电报,   type: cls,   lang: zh}
    # 华尔街见闻走资讯流（文章）而不是快讯流：快讯流 100 条基本是 A 股异动，
    # 跟财联社重合；资讯流是编辑筛过的，常带机构观点，配合「观点要点名」的规则。
    - {name: 华尔街见闻,   type: wscn,  lang: zh, channel: global-channel, limit: 40}
    # 金十期货头条：只有标题没正文（详情接口全 502），判定时天然弱于有长摘要的源，
    # 主要当「期货圈今天在看什么」的信号。鉴权头写在 sources.fetch_jin10 里。
    - {name: 金十期货,     type: jin10, lang: zh}
    - {name: GN-美联储与利率, type: gnews, lang: en, query: 'Federal Reserve OR FOMC OR Powell (rate OR policy OR minutes) when:2d'}
    - {name: GN-美国经济数据, type: gnews, lang: en, query: 'US (CPI OR inflation OR payrolls OR "jobless claims" OR PCE OR "retail sales" OR ISM OR GDP) when:2d'}
    - {name: GN-关税与贸易,   type: gnews, lang: en, query: '(tariff OR "trade deal" OR "export controls" OR sanctions) (US OR China OR EU) when:2d'}
    - {name: GN-美债与美元,   type: gnews, lang: en, query: '("Treasury yields" OR "bond market" OR "dollar index" OR "safe haven") when:2d'}
    - {name: GN-华尔街,      type: gnews, lang: en, query: 'site:reuters.com (stocks OR "Wall Street" OR Nasdaq OR "S&P 500") when:2d'}
    - {name: GN-地缘与能源,   type: gnews, lang: en, query: '(OPEC OR "oil prices" OR Russia OR Iran OR "Middle East") (supply OR sanctions OR conflict) when:2d'}
    - {name: GN-央行与全球,   type: gnews, lang: en, query: '(ECB OR "Bank of Japan" OR "People''s Bank of China" OR BOE) (rate OR policy) when:2d'}

    # ---------------- 铜 ----------------
    - {name: SHMET铜快讯,  type: shmet, lang: zh, channel: '铜'}
    - {name: Mining.com,  type: rss,   lang: en, url: "https://www.mining.com/feed/"}
    - {name: Mining-铜频道, type: rss,  lang: en, url: "https://www.mining.com/commodity/copper/feed/"}
    # 矿业专业媒体。发文频率低（一天 1-6 条），但条条是行业内容，一次请求的成本
    # 换偶尔一条硬消息，划算。注意别用 site:reuters.com 查金属——路透给每家矿业
    # 公司都建了行情页，元数据含 copper/aluminium，一查 100 条里 98 条是报价页。
    - {name: Northern Miner, type: rss, lang: en, url: "https://www.northernminer.com/feed/"}
    - {name: International Mining, type: rss, lang: en, url: "https://im-mining.com/feed/"}
    - {name: GN-铜矿供应,   type: gnews, lang: en, query: 'copper (mine OR smelter OR concentrate OR "treatment charges") when:2d'}
    - {name: GN-铜供应中断, type: gnews, lang: en, query: 'copper (strike OR halt OR suspend OR "force majeure" OR landslide) mine when:2d'}
    - {name: GN-铜库存政策, type: gnews, lang: en, query: 'copper (inventories OR stockpiles OR "LME warehouse" OR tariff OR "export ban") when:2d'}

    # ---------------- 铝 ----------------
    - {name: SHMET铝快讯,  type: shmet, lang: zh, channel: '铝'}
    - {name: GN-铝供应,     type: gnews, lang: en, query: 'aluminium (smelter OR alumina OR bauxite OR "production cut" OR capacity) when:2d'}
    - {name: GN-铝库存政策, type: gnews, lang: en, query: 'aluminium (inventories OR "LME warehouse" OR tariff OR "export tax" OR premium) when:2d'}
    # 注意是美式拼写 aluminum，aluminium 那个 slug 是 404
    - {name: Mining-铝频道, type: rss,  lang: en, url: "https://www.mining.com/commodity/aluminum/feed/"}
    # 国际铝业协会：权威产量与供应统计，周更级别。铝栏本来就比铜薄，
    # 它发一条顶得上十条转述（如 GULF ALUMINIUM OUTPUT COLLAPSES BY 40%）。
    - {name: IAI国际铝业, type: rss, lang: en, url: "https://international-aluminium.org/feed/"}

  # 粗筛：把明显无关的砍掉，别让它们花 Claude 的钱。真正的判断交给 LLM。
  buckets:
    宏观:
      precedence: 2        # 数字小的先认领条目，每条只进一个板块
      top_n: 8
      min_importance: 3
      keywords:
        must:
          - fed
          - fomc
          - powell
          - 美联储
          - rate cut
          - 降息
          - 加息
          - inflation
          - 通胀
          - cpi
          - ppi
          - pce
          - payroll
          - 非农
          - jobless
          - unemployment
          - 失业
          - gdp
          - ism
          - retail sales
          - tariff
          - 关税
          - trade
          - 贸易
          - treasury
          - yield
          - 美债
          - dollar
          - 美元
          - sanction
          - 制裁
          - opec
          - 原油
          - oil price
          - ecb
          - 欧洲央行
          - bank of japan
          - 日本央行
          - 央行
          - shutdown
          - 财政
          - recession
          - 衰退
          - wall street
          - nasdaq
          - s&p 500
          - 标普
          - 纳斯达克
          - 美股
          - earnings
          - 财报
        block:
          - 券商
          - 荐股
          - 目标价
          - 买入评级
          - 增持评级
          - 彩票
          - 娱乐
          - 明星
          # 日程预告：规则档分不清「将公布」和「已公布」，价值差一个数量级
          - what to expect
