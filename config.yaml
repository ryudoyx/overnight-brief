# 隔夜早报配置。加减标的、调阈值都改这里，不用动代码。

runtime:
  spark_days: 10          # 迷你走势线取多少个交易日
  history_days: 40        # 日线回看窗口，够算 spark 和成交量均值

# ---------------------------------------------------------------- 指数与利率汇率
indices:
  - {sym: "^GSPC",  name: "标普500"}
  - {sym: "^IXIC",  name: "纳斯达克"}
  - {sym: "^DJI",   name: "道琼斯"}
  - {sym: "^RUT",   name: "罗素2000"}
  - {sym: "^VIX",   name: "VIX 恐慌指数"}

macro_markets:
  - {sym: "^TNX",      name: "美债10年期", unit: "%"}
  - {sym: "^FVX",      name: "美债5年期",  unit: "%"}
  - {sym: "DX-Y.NYB",  name: "美元指数",   unit: ""}
  - {sym: "CNY=X",     name: "美元兑人民币", unit: ""}

# ---------------------------------------------------------------- 板块（SPDR 11 大板块 + 两个风向标）
sectors:
  - {sym: "XLK",  name: "科技"}
  - {sym: "XLC",  name: "通信服务"}
  - {sym: "XLY",  name: "非必需消费"}
  - {sym: "XLP",  name: "必需消费"}
  - {sym: "XLE",  name: "能源"}
  - {sym: "XLF",  name: "金融"}
  - {sym: "XLV",  name: "医疗保健"}
  - {sym: "XLI",  name: "工业"}
  - {sym: "XLB",  name: "原材料"}
  - {sym: "XLRE", name: "房地产"}
  - {sym: "XLU",  name: "公用事业"}
  - {sym: "SMH",  name: "半导体", extra: true}
  - {sym: "KWEB", name: "中概互联", extra: true}

# ---------------------------------------------------------------- 个股异动
# 大票异动走 Yahoo screener（全美股按市值门槛筛），自选池单独取数保证一定出现
movers:
  min_market_cap: 20000000000   # 200 亿美元
  min_volume: 500000
  top_n: 8                      # 涨跌各取几只
  min_abs_pct: 2.0              # 涨跌幅不到这个数就不算「明显」，宁可少列

watchlist:
  矿业:
    - {sym: "FCX",  name: "自由港"}
    - {sym: "SCCO", name: "南方铜业"}
    - {sym: "TECK", name: "泰克资源"}
    - {sym: "RIO",  name: "力拓"}
    - {sym: "BHP",  name: "必和必拓"}
    - {sym: "VALE", name: "淡水河谷"}
    - {sym: "AA",   name: "美国铝业"}
    - {sym: "MP",   name: "MP 稀土"}
    - {sym: "NEM",  name: "纽蒙特"}
    - {sym: "AEM",  name: "Agnico Eagle"}
    - {sym: "GOLD", name: "巴里克"}
    - {sym: "HBM",  name: "哈德贝"}
    - {sym: "ERO",  name: "Ero Copper"}
  中概:
    - {sym: "BABA", name: "阿里巴巴"}
    - {sym: "PDD",  name: "拼多多"}
  # AI 链条。对做铜的人这一栏是双重用途：既看科技情绪，也是铜需求的先行指标——
  # 数据中心的电力和布线是这几年精铜增量需求里最硬的一块。
