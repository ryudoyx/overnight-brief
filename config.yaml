# ================================================================ 判定与叙述后端
# 三档，改 backend 一行切换。所有档位都只负责文字，不许碰任何数字——
# 涨跌幅、价格、库存全部由 quotes.py 实测，模型只做组织和取舍。
judge:
  # rules          零 key 零成本；英文标题保留原文不翻译，也没有串讲
  # openai_compat  接各家免费额度（Gemini / Groq / 智谱），有中文摘要和串讲
  # claude         质量最好，约 $5/月
  backend: openai_compat

  openai_compat:
    # 默认填 Gemini 免费层。换 Groq / 智谱只改这三行：
    #   Groq   https://api.groq.com/openai/v1              llama-3.3-70b-versatile
    #   智谱   https://open.bigmodel.cn/api/paas/v4        glm-4-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.7-flash
    # 免费层 503「模型过载」是常态：3.7-flash 实测三次挂一次，flash-lite 三次全过。
    # 主模型重试仍不行就自动降级到备胎，别让一次抖动把整批新闻丢掉。
    fallback_models: [gemini-3.1-flash-lite]
    retries: 4
    api_key_env: GEMINI_API_KEY
    temperature: 0.2

  claude:
    id: claude-sonnet-5  # 遇到大事件想要更好的叙述，手动改成 claude-opus-5 重跑
    effort: low          # low | medium | high | xhigh | max（默认 high，早报用 low 够了）
