          - Collahuasi
          - 紫金
          - 洛阳钼业
          - 江西铜业
          - Cochilco
          - ICSG
        block:
          - copper mountain resort
          - copper canyon
          # 汇总贴：一条里塞十几件事，词表会把分数累加刷成高星，但它不是事件
          - 市场热点回顾
          - 热点回顾
          - 早间新闻
          - 财经早餐
          - 一图看懂
          - 数据汇总
          - 铜锣湾
